<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="index.css" rel="stylesheet">
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
        <title>SugabaeHUZZ</title>
    </head>
    <body>
        <!-- Envelope Animation -->
        <div class="envelope-wrapper">
            <div id="envelope" class="close">
                <div class="front flap"></div>
                <div class="front pocket"></div>
                <div class="letter">
                    <p class="words line1">Hello Bae,</p>
                    <p class="words line2">Will you be my suga for Valentine's Day?!</p>
                    <p class="words line3">Love,</p>
                    <p class="words line4">Daniel😘</p>
                </div>
                <div class="hearts">
                    <div class="heart a1"></div>
                    <div class="heart a2"></div>
                    <div class="heart a3"></div>
                </div>
            </div>
        </div>

        <!-- Open & Reset Buttons -->
        <div class="reset">
            <button id="open">Open</button>
            <button id="reset">Reset</button>
        </div>



        <!-- Audio Element -->
        <audio id="openAudio" src="Tamar Braxton - Let Me Know (Official Video) ft. Future 1.mp3"></audio>

        <!-- JavaScript File -->
        <script src="index.js"></script>
    </body>
</html>
